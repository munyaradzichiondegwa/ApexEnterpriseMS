name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build, unit + PostgreSQL integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apexerp
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apexerp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration tests create (and drop) a throw-away database per test on this server.
      APEX_TEST_DB: "Host=localhost;Port=5432;Database=postgres;Username=apexerp;Password=ci_only_password"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore backend/ApexERP.sln
      - name: Build
        run: dotnet build backend/ApexERP.sln --no-restore -c Release
      - name: Test
        run: dotnet test backend/tests/ApexERP.Tests/ApexERP.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/test-results.trx"

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
