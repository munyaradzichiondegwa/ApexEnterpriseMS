version: "3.9"

# Local development stack. It runs the API in the Development environment, which allows the development-only
# configuration in appsettings.Development.json. To deploy for real: copy .env.example to .env, set every value
# (a strong JWT_SECRET, a unique POSTGRES_PASSWORD, the real FRONTEND_ORIGIN / NEXT_PUBLIC_API_URL) and set
# ASPNETCORE_ENVIRONMENT=Production. In Production the API REFUSES TO START with a missing, weak or placeholder secret.

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexerp
      POSTGRES_USER: apexerp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-apexerp_dev_password}"
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only, not from the network
    volumes:
      - apexerp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/ApexERP.API/Dockerfile
    container_name: apexerp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=apexerp;Username=apexerp;Password=${POSTGRES_PASSWORD:-apexerp_dev_password}"
      # Local-development fallback only (>= 32 characters, clearly marked). The API rejects it outside Development.
      Jwt__Secret: "${JWT_SECRET:-dev-only-compose-signing-key-never-use-in-production-4d8e2a6c}"
      Jwt__Issuer: "ApexERP"
      Frontend__Origin: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle at BUILD time, so they are build arguments.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
    container_name: apexerp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  apexerp_pgdata:
