version: "3.9"

# Local development stack. It runs the API in the Development environment, which allows the development-only
# configuration in appsettings.Development.json. To deploy for real: copy .env.example to .env, set every value
# (a strong JWT_SECRET, a unique POSTGRES_PASSWORD, the real FRONTEND_ORIGIN / NEXT_PUBLIC_API_URL) and set
# ASPNETCORE_ENVIRONMENT=Production. In Production the API REFUSES TO START with a missing, weak or placeholder secret.

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexerp
      POSTGRES_USER: apexerp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-apexerp_dev_password}"
    ports:
      - "127.0.0.1:5432:5432"   # reachable from this machine only, not from the network
    volumes:
      - apexerp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexerp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/ApexERP.API/Dockerfile
    container_name: apexerp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=apexerp;Username=apexerp;Password=${POSTGRES_PASSWORD:-apexerp_dev_password}"
      # Local-development fallback only (>= 32 characters, clearly marked). The API rejects it outside Development.
      Jwt__Secret: "${JWT_SECRET:-dev-only-compose-signing-key-never-use-in-production-4d8e2a6c}"
      Jwt__Issuer: "ApexERP"
      Frontend__Origin: "${FRONTEND_ORIGIN:-http://localhost:3000}"
      PlatformJwt__Issuer: "${PLATFORM_JWT_ISSUER:-ApexERP.Platform}"
      PlatformJwt__Audience: "${PLATFORM_JWT_AUDIENCE:-ApexERP.Platform.Api}"
      PlatformJwt__PublicKeyPem: "${PLATFORM_JWT_PUBLIC_KEY_PEM:-}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      Operations__WorkerUrl: "${OPERATIONS_WORKER_URL:-}"
      Operations__WorkerSecret: "${OPERATIONS_WORKER_SECRET:-}"
      # The API sits behind the web container's proxy, so use the forwarded client IP for rate limiting and the audit trail.
      Security__TrustForwardedHeaders: "${TRUST_FORWARDED_HEADERS:-false}"
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are compiled into the browser bundle at BUILD time, so they are build arguments.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
        # The browser calls /backend on this site; the web server forwards it to the API over the internal Docker network.
        API_PROXY_TARGET: "${API_PROXY_TARGET:-http://api:8080}"
    container_name: apexerp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  apexerp_pgdata:
